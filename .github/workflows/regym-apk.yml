# reGym: builds the Android APK of this fork and publishes it as a GitHub release, so the phone
# can install it from github.com/has-bi/reGym/releases/latest.
#
# Phone-only build of the sideload flavor: its own package (ch.duartesantos.opengym.regym), signed
# with reGym's own key, updater pointed at this repository. The exercise animations are the
# repository's unmodified 180 px set, which a non-commercial fork may keep (NOTICE.md).
#
# Secrets (Settings → Secrets and variables → Actions):
#   REGYM_KEYSTORE_B64       the keystore, base64. KEEP THE ORIGINAL: every update must be signed
#                            with it, or Android refuses to install over the existing app.
#   REGYM_KEYSTORE_PASSWORD  keystore (and key) password
#   REGYM_KEY_ALIAS          key alias
name: reGym APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regym-apk
  cancel-in-progress: true

jobs:
  apk:
    if: github.repository == 'has-bi/reGym'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VITE_UPDATE_REPO: has-bi/reGym
    steps:
      - uses: actions/checkout@v5

      # Above upstream's versionCode and rising with every run, so each APK installs as an
      # update. Computed in shell: workflow expressions have no arithmetic.
      - name: Version code
        run: echo "VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # The Ubuntu runner ships the Android SDK (ANDROID_HOME) with its licences accepted; only
      # make sure the platform openGym compiles against (compileSdk 36) and its build-tools exist.
      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Install
        run: |
          npm ci
          cd frontend && npm ci

      - name: Phone build (web assets + Capacitor sync)
        working-directory: frontend
        run: npm run build:mobile

      - name: Gradle release build
        working-directory: frontend/android
        run: |
          set +e
          ./gradlew --no-daemon assembleSideloadRelease -PregymVersionCode=$VERSION_CODE 2>&1 | tee gradle.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface Gradle's own explanation as an annotation, readable without opening the log.
            msg=$(sed -n '/What went wrong/,/^\* Try/p' gradle.log | head -60)
            [ -n "$msg" ] || msg=$(grep -iE "error|exception|failed" gradle.log | tail -40)
            msg="${msg//'%'/'%25'}"; msg="${msg//$'\n'/'%0A'}"
            echo "::error title=Gradle failed::$msg"
          fi
          exit $status

      - name: Sign
        env:
          KS_B64: ${{ secrets.REGYM_KEYSTORE_B64 }}
          KS_PASS_RAW: ${{ secrets.REGYM_KEYSTORE_PASSWORD }}
          KS_ALIAS_RAW: ${{ secrets.REGYM_KEY_ALIAS }}
        run: |
          fail() { echo "::error title=Sign failed::$1"; exit 1; }
          test -n "$KS_B64" || fail "REGYM_KEYSTORE_B64 secret is missing"
          test -n "$KS_PASS_RAW" || fail "REGYM_KEYSTORE_PASSWORD secret is missing"
          # Pasted secrets often pick up spaces or line breaks; none of these values contain any.
          export KS_PASS=$(printf '%s' "$KS_PASS_RAW" | tr -d '[:space:]')
          KS_ALIAS=$(printf '%s' "${KS_ALIAS_RAW:-regym}" | tr -d '[:space:]')
          KS="$RUNNER_TEMP/regym.keystore"
          printf '%s' "$KS_B64" | tr -d '[:space:]' | base64 -d > "$KS" 2>/dev/null \
            || fail "REGYM_KEYSTORE_B64 is not valid base64 (paste the whole keystore.b64, one line)"
          keytool -list -keystore "$KS" -storepass "$KS_PASS" > keytool.out 2>&1 \
            || fail "Keystore rejected: $(tail -1 keytool.out) (check REGYM_KEYSTORE_PASSWORD)"
          grep -qi "^$KS_ALIAS," keytool.out \
            || fail "Alias '$KS_ALIAS' not in the keystore (aliases: $(grep -i privatekeyentry keytool.out | cut -d, -f1 | tr '\n' ' '))"

          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          VER=$(node -p "require('./frontend/package.json').version")
          OUT="reGym-$VER-$VERSION_CODE.apk"
          "$BT/zipalign" -p -f 4 frontend/android/app/build/outputs/apk/sideload/release/app-sideload-release-unsigned.apk aligned.apk \
            || fail "zipalign failed"
          "$BT/apksigner" sign --ks "$KS" --ks-pass env:KS_PASS \
            --ks-key-alias "$KS_ALIAS" --key-pass env:KS_PASS --out "$OUT" aligned.apk 2> sign.err \
            || fail "apksigner: $(tail -3 sign.err | tr '\n' ' ')"
          "$BT/apksigner" verify --print-certs "$OUT" | head -3
          sha256sum "$OUT" | cut -d' ' -f1 > "$OUT.sha256"
          rm -f "$KS"
          echo "APK=$OUT" >> "$GITHUB_ENV"
          echo "VER=$VER" >> "$GITHUB_ENV"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: regym-${{ env.VERSION_CODE }}
          name: reGym ${{ env.VER }} (build ${{ env.VERSION_CODE }})
          body: |
            Built from ${{ github.sha }}. Install the APK on the phone; it updates the existing reGym and keeps its data.
          files: |
            ${{ env.APK }}
            ${{ env.APK }}.sha256
